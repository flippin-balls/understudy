[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "understudy"
version = "0.3.0"
description = "Convert Bally Squawk & Talk TMS5200 speech ROMs to run on TMS5220-family replacements"
readme = "README.md"
requires-python = ">=3.9"
# Understudy's own code and documentation are 0BSD. The distribution also
# contains third-party coefficient data under BSD-3-Clause (MAME), so the
# distribution as a whole is not 0BSD -- see THIRD_PARTY_NOTICES.md, which
# ships inside the package.
license = { text = "0BSD AND BSD-3-Clause" }
authors = [{ name = "Flashback Fleet LLC" }]
keywords = ["tms5200", "tms5220", "tms5220c", "tsp5220c", "lpc", "speech",
            "pinball", "bally", "squawk-and-talk", "retrocomputing",
            "preservation", "rom-hacking"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "License :: OSI Approved :: Zero-Clause BSD (0BSD)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: System :: Hardware",
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
]
dependencies = []

[project.scripts]
understudy = "tms52xx.cli:main"

[project.urls]
Source = "https://github.com/flippin-balls/understudy"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bundled coefficient tables and game profiles MUST ship in the wheel;
# without them an installed Understudy cannot convert anything without setup.
#
# The licence materials must ship too. The tables are MAME's under
# BSD-3-Clause, and that licence requires its notice to travel with binary
# redistribution -- a wheel is binary redistribution, and files sitting beside
# the repository do not survive `pip install`.
"tms52xx" = [
  "data/*.json",
  "data/profiles/*.json",
  "data/licenses/*.txt",
  "data/licenses/*.md",
]
