[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "understudy"
version = "0.1.0"
description = "Convert TMS5200 LPC speech data to run on TMS5220 chips"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "0BSD" }
authors = [{ name = "Flashback Fleet LLC" }]
keywords = ["tms5200", "tms5220", "lpc", "speech", "pinball", "retrocomputing"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
understudy = "tms52xx.cli:main"

[project.urls]
Source = "https://github.com/flippin-balls/understudy"

[tool.setuptools.packages.find]
where = ["src"]
