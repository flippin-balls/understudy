name: tests
# The suite is pure standard library and needs no fixtures, network or ROM data,
# so it runs as-is on every supported interpreter. The version matrix is not
# decoration: README.md claims Python 3.9 or newer, and this is what checks it.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]      # the oldest supported, and a current one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unittest
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: the package imports and the CLI runs
        run: |
          set -euo pipefail
          PYTHONPATH=src python -c "import tms52xx; print(tms52xx.__version__)"
          PYTHONPATH=src python -m tms52xx.cli --help > /dev/null
          PYTHONPATH=src python -m tms52xx.cli inspect --help > /dev/null
          PYTHONPATH=src python -m tms52xx.cli convert --help > /dev/null
